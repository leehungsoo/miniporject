<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
  </style>

  <script>
      window.addEventListener("DOMContentLoaded", function () {
          const submitForm = document.querySelector("#login-form");
          submitForm.addEventListener("submit", function (event) {
              const loading = document.querySelector("#loading");
              loading.classList.remove("d-none");
          });
      });
  </script>

</head>
<body class="bg-light">
<div th:replace="~{layout/header :: mainHeader}"></div>
<main class="container mt-5">
  <div class="row">
    <div class="col-sm">
      <form action="/login" method="post" th:if="${session.memberId == null}" id="login-form">
        <label for="member-id" class="form-label">아이디</label>
        <input id="member-id" type="text" name="memberId" class="form-control" placeholder="회원ID" required>
        <label for="member-pwd" class="form-label">비밀번호</label>
        <input id="member-pwd" type="password" name="memberPwd" class="form-control" placeholder="비밀번호" required>
        <button type="submit" class="btn btn-primary form-control mt-1" id="btn-ok">확인</button>
      </form>
      <div th:unless="${session.memberId == null}" class="text-center">
        <h1>관리자 <span th:text="${session.memberName}"></span> 로그인</h1>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>

<div class="fixed-top top-0 w-100 h-100 z-3 d-none" style="background: rgba(0,0,0,0.6)" id="loading">
  <div class="h-100 d-flex justify-content-center align-items-center">
    <span class="spinner-border" role="status" aria-hidden="true"></span>
  </div>
</div>

</html>
